services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    volumes:
      - calc-socket:/run/huongnang:ro
    ports:
      - "${APP_PORT:-5173}:5173"
    environment:
      NODE_ENV: production
      PORT: "5173"
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
    depends_on:
      calculator:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  calculator:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SOL_PPROF: ${SOL_PPROF:-0}
    network_mode: none
    volumes:
      - calc-socket:/run/huongnang
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
volumes:
  calc-socket:
  redis-data:
